name: Release APK

# v* タグが push されたら署名付きリリースAPKをビルドし、GitHub Release を作成する
on:
  push:
    tags:
      - 'v*'
  # 手動実行も可能にしておく（既存タグの作り直し用）
  workflow_dispatch:
    inputs:
      tag:
        description: 'ビルド対象のタグ (例: v1.1.8)'
        required: true

permissions:
  contents: write   # リリース作成に必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch の場合は指定タグを、push の場合は既定の ref を使う
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret が未設定です。リポジトリ設定 > Secrets で登録してください。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/scrcpy.jks

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate signed APK
        id: apk
        run: |
          apk=$(find app/build/outputs/apk -name '*-release.apk' ! -name '*unsigned*' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::署名済みAPKが見つかりません。署名設定を確認してください。"
            find app/build/outputs/apk -name '*.apk'
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "見つかったAPK: $apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: scrdroid-tv ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
