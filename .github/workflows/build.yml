name: Build debug APK

# push / PR のたびにデバッグ APK をビルドし、Actions の Artifacts に置く。
# 署名鍵(Secrets)が無くても動くので、Fire TV へのお試しインストールはこれで十分。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleScrcpyDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scrdroid-tv-debug
          path: app/build/outputs/apk/scrcpy/debug/*.apk
